<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog — demo_website</title>
<link rel="stylesheet" href="css/styles.css">
<style>.product-card .product-img{height:180px !important}.product-card .product-img img{width:100%;height:100%;object-fit:cover}</style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div class="container">
    <h1>Product Catalog</h1>
    <p>Browse our full range of office and facility supplies.</p>
  </div>
</div>
<section style="padding-top:20px">
  <div class="container">
    <div class="toolbar">
      <input type="text" class="search-input" id="search-input" placeholder="Search products..." oninput="renderCatalog()">
      <select class="chip" id="cat-filter" onchange="renderCatalog()" style="border:1.5px solid var(--border)">
        <option value="">All Categories</option>
      </select>
      <select class="chip" id="sort-filter" onchange="renderCatalog()" style="border:1.5px solid var(--border)">
        <option value="name">Sort: Name (A-Z)</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
      </select>
    </div>
    <div class="grid grid-4" id="catalog-grid"></div>
    <div class="empty-state" id="no-results" style="display:none;padding:60px 20px;text-align:center;color:var(--text-dim)">
      <div style="font-size:3rem;margin-bottom:16px">🔍</div>
      <p>No products found. Try a different search or filter.</p>
    </div>
  </div>
</section>
<script>
const PRODUCT_IMAGES={"1": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "2": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "3": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "4": "https://images.unsplash.com/photo-1585421514738-01798e348b17?w=600&q=80&auto=format&fit=crop", "5": "https://images.unsplash.com/photo-1585421514738-01798e348b17?w=600&q=80&auto=format&fit=crop", "6": "https://images.unsplash.com/photo-1585421514738-01798e348b17?w=600&q=80&auto=format&fit=crop", "7": "https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=600&q=80&auto=format&fit=crop", "8": "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=600&q=80&auto=format&fit=crop", "9": "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&q=80&auto=format&fit=crop", "10": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "11": "https://images.unsplash.com/photo-1597318181409-cf64d0b5d8a2?w=600&q=80&auto=format&fit=crop", "12": "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=600&q=80&auto=format&fit=crop", "13": "https://images.unsplash.com/photo-1513885535751-8b9238fd3c42?w=600&q=80&auto=format&fit=crop", "14": "https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=600&q=80&auto=format&fit=crop", "15": "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&q=80&auto=format&fit=crop", "16": "https://images.unsplash.com/photo-1580480045273-3611478254b4?w=600&q=80&auto=format&fit=crop"};
function initFilters(){
  const sel=document.getElementById("cat-filter");
  CATEGORIES.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o)});
  const params=new URLSearchParams(window.location.search);
  const cat=params.get("cat");
  if(cat){sel.value=cat;renderCatalog()}
}
function renderCatalog(){
  const search=document.getElementById("search-input").value.toLowerCase();
  const cat=document.getElementById("cat-filter").value;
  const sort=document.getElementById("sort-filter").value;
  let items=PRODUCTS.filter(p=>
    (!search||p.name.toLowerCase().includes(search)||p.category.toLowerCase().includes(search))&&
    (!cat||p.category===cat)
  );
  if(sort==="name")items.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==="price-low")items.sort((a,b)=>a.price-b.price);
  else if(sort==="price-high")items.sort((a,b)=>b.price-a.price);
  const grid=document.getElementById("catalog-grid");
  const empty=document.getElementById("no-results");
  if(items.length===0){grid.innerHTML="";empty.style.display="block";return}
  empty.style.display="none";
  grid.innerHTML=items.map(p=>`
    <a href="product.html?id=${p.id}" class="product-card">
      <div class="product-img">${PRODUCT_IMAGES[p.id]?`<img src="${PRODUCT_IMAGES[p.id]}" alt="${p.name}" loading="lazy">`:p.emoji}</div>
      <div class="product-body">
        <span class="product-cat">${p.category}</span>
        <h3>${p.name}</h3>
        <div class="price">${formatPrice(p.price)}</div>
        <div class="stock ${p.stock>0?'in':''}">${p.stock>0?'✓ In stock ('+p.stock+')':'✗ Out of stock'}</div>
      </div>
    </a>
  `).join("");
}
initFilters();
renderCatalog();
</script>
<div id="footer-placeholder"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
