<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog — demo_website</title>
<meta name="description" content="Browse the demo_website product catalog.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav-placeholder"></div>

<section class="page-head">
  <div class="container">
    <h1 class="section-title">Product Catalog</h1>
    <p class="section-sub">Browse our full range of office supplies and services.</p>
    <div class="toolbar">
      <input type="text" id="search" class="search-input" placeholder="Search products…" oninput="renderCatalog()">
      <select id="sort" class="search-input" style="max-width:200px;flex:0 0 200px" onchange="renderCatalog()">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="name">Name: A → Z</option>
      </select>
    </div>
    <div class="toolbar" id="chips"></div>
    <div class="grid grid-4" id="catalog-grid"></div>
    <p id="no-results" class="muted" style="display:none;text-align:center;padding:40px 0">No products match your search.</p>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
let activeCat="All";
const params=new URLSearchParams(window.location.search);
if(params.get("cat")&&CATEGORIES.includes(params.get("cat")))activeCat=params.get("cat");

function buildChips(){
  const chips=["All"].concat(CATEGORIES);
  document.getElementById("chips").innerHTML=chips.map(c=>`
    <button class="chip${c===activeCat?" active":""}" onclick="setCat('${c}')">${c}</button>
  `).join("");
}
function setCat(c){activeCat=c;buildChips();renderCatalog()}

function renderCatalog(){
  const q=(document.getElementById("search").value||"").toLowerCase();
  const sort=document.getElementById("sort").value;
  let list=PRODUCTS.filter(p=>
    (activeCat==="All"||p.category===activeCat)&&
    (p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))
  );
  if(sort==="price-asc")list=list.slice().sort((a,b)=>a.price-b.price);
  if(sort==="price-desc")list=list.slice().sort((a,b)=>b.price-a.price);
  if(sort==="name")list=list.slice().sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById("no-results").style.display=list.length?"none":"block";
  document.getElementById("catalog-grid").innerHTML=list.map(p=>`
    <div class="product-card">
      <a href="product.html?id=${p.id}" style="color:inherit">
        <div class="product-img">${p.emoji}</div>
        <div class="product-body">
          <span class="product-cat">${p.category}</span>
          <h3>${p.name}</h3>
          <div class="price">${formatPrice(p.price)}</div>
          <div class="stock ${p.stock>0?"in":""}">${p.stock>0?"In stock ("+p.stock+")":"Out of stock"}</div>
        </div>
      </a>
      <div style="padding:0 20px 20px">
        <button class="btn btn-primary btn-sm btn-block" ${p.stock>0?"":"disabled"} onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    </div>
  `).join("");
}
function addToCart(id){Cart.add(id);toast("Added to cart: "+getProduct(id).name)}

buildChips();
renderCatalog();
</script>
</body>
</html>
