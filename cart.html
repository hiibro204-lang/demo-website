<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — demo_website</title>
<meta name="description" content="Your shopping cart on the demo_website educational demo.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav-placeholder"></div>

<section class="page-head">
  <div class="container">
    <h1 class="section-title">Your Cart</h1>
    <p class="section-sub">Review your items before checkout.</p>
    <div id="cart-content"></div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
function renderCart(){
  const el=document.getElementById("cart-content");
  const items=Cart.itemsWithProducts();
  if(items.length===0){
    el.innerHTML=`
    <div class="success-panel">
      <div class="big">🛒</div>
      <h2>Your cart is empty</h2>
      <p class="muted" style="margin:10px 0 22px">Looks like you haven't added anything yet.</p>
      <a href="catalog.html" class="btn btn-primary">Browse Catalog</a>
    </div>`;
    return;
  }
  const rows=items.map(i=>`
    <div class="cart-item">
      <div class="emoji">${i.product.emoji}</div>
      <div class="info">
        <h4>${i.product.name}</h4>
        <span class="muted">${i.product.category} · ${formatPrice(i.product.price)} each</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="qty-btn" onclick="setQty(${i.productId},${i.qty-1})">−</button>
        <span style="font-weight:700;min-width:22px;text-align:center">${i.qty}</span>
        <button class="qty-btn" onclick="setQty(${i.productId},${i.qty+1})">+</button>
      </div>
      <div style="font-weight:800;min-width:90px;text-align:right">${formatPrice(i.product.price*i.qty)}</div>
      <button class="link-danger" onclick="removeItem(${i.productId})">✕ Remove</button>
    </div>`).join("");
  el.innerHTML=`
  <div class="cart-layout">
    <div>${rows}</div>
    <div class="summary card" style="padding:26px">
      <h3 style="margin-bottom:14px">Order Summary</h3>
      <div class="sum-row"><span>Items</span><span>${Cart.count()}</span></div>
      <div class="sum-row"><span>Subtotal</span><span>${formatPrice(Cart.total())}</span></div>
      <div class="sum-row"><span>Delivery</span><span class="muted">Free</span></div>
      <div class="sum-row total"><span>Total</span><span>${formatPrice(Cart.total())}</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block mt-20">Proceed to Checkout</a>
      <button class="btn btn-secondary btn-block mt-20" onclick="clearCart()">Clear Cart</button>
    </div>
  </div>`;
}
function setQty(id,qty){Cart.updateQty(id,qty);renderCart()}
function removeItem(id){Cart.remove(id);toast("Item removed");renderCart()}
function clearCart(){Cart.clear();renderCart();toast("Cart cleared")}

renderCart();
</script>
</body>
</html>
