<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — demo_website</title>
<meta name="description" content="Frequently asked questions about the demo_website educational demo.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav-placeholder"></div>

<section class="page-head">
  <div class="container" style="max-width:820px">
    <h1 class="section-title" style="text-align:center">Frequently Asked Questions</h1>
    <p class="section-sub" style="text-align:center">Everything you need to know about the demo platform.</p>
    <div id="faq-list"></div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
const FAQS=[
  ["What is demo_website?","demo_website is an educational demo of a B2B office supplies and managed procurement platform. It demonstrates catalog browsing, a shopping cart, checkout, a buyer dashboard, and a vendor order-management portal — running entirely in the browser."],
  ["Are the products and orders real?","No. Everything on this site is mock data. Products, prices, stock levels, orders, and invoices are sample records. No payment is processed and no goods are shipped."],
  ["Where is my data stored?","All accounts, carts, and orders are stored in your browser's localStorage. Nothing is sent to a server. Clearing your browser data will reset the demo."],
  ["Do I need an account to browse?","No — browsing the catalog and product pages is open to everyone. An account is only needed for checkout and the buyer dashboard."],
  ["How do I become a vendor?","Sign up from the login page and choose the 'Vendor' account type. You will get access to the Vendor Portal, where you can view sample orders and advance their status."],
  ["What payment methods are supported?","For the demo, checkout records an order against a mock invoice. No card details are collected and no payment gateway is involved."],
  ["Can I use this code for my own project?","Yes — this is an educational demo. Feel free to study, reuse, and extend the HTML, CSS, and JavaScript for learning purposes."],
  ["I found a bug. Where do I report it?","Use the contact form or email hello@demo-website.com. Feedback is welcome, though this is a demo project and fixes are best-effort."]
];
document.getElementById("faq-list").innerHTML=FAQS.map((f,i)=>`
  <div class="faq-item" id="faq-${i}">
    <button class="faq-q" onclick="toggleFaq(${i})">${f[0]}<span class="chev">▼</span></button>
    <div class="faq-a"><div class="faq-a-inner">${f[1]}</div></div>
  </div>`).join("");
function toggleFaq(i){document.getElementById("faq-"+i).classList.toggle("open")}
</script>
</body>
</html>
