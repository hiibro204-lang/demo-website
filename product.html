<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — demo_website</title>
<meta name="description" content="Product detail page for the demo_website educational demo.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav-placeholder"></div>

<section>
  <div class="container" id="product-container"></div>
</section>

<div id="footer-placeholder"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
const params=new URLSearchParams(window.location.search);
const product=getProduct(parseInt(params.get("id"),10));

if(!product){
  document.getElementById("product-container").innerHTML=`
  <div class="success-panel">
    <div class="big">🔍</div>
    <h2>Product not found</h2>
    <p class="muted" style="margin:10px 0 22px">The product you are looking for does not exist.</p>
    <a href="catalog.html" class="btn btn-primary">Back to Catalog</a>
  </div>`;
}else{
  document.getElementById("product-container").innerHTML=`
  <div class="product-detail">
    <div class="product-hero">${product.emoji}</div>
    <div>
      <a href="catalog.html?cat=${encodeURIComponent(product.category)}" class="product-cat">${product.category}</a>
      <h1 style="font-size:1.9rem;margin:8px 0 10px">${product.name}</h1>
      <div class="price" style="font-size:1.6rem">${formatPrice(product.price)}</div>
      <div class="stock ${product.stock>0?"in":""}" style="margin:8px 0 18px">${product.stock>0?"In stock — "+product.stock+" units available":"Out of stock"}</div>
      <p class="muted">${product.desc}</p>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <input type="number" id="qty" class="qty-input" value="1" min="1" max="${product.stock}" onchange="qtyVal()">
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <button class="btn btn-primary" style="width:100%;max-width:320px" ${product.stock>0?"":"disabled"} onclick="addThisToCart()">Add to Cart</button>
      <p class="muted" style="font-size:.83rem;margin-top:14px">🚚 Nationwide delivery in 2–5 business days · Educational demo — no real orders are placed.</p>
    </div>
  </div>
  <div style="margin-top:64px">
    <h2 class="section-title" style="font-size:1.3rem">Related products</h2>
    <p class="section-sub">More from ${product.category}.</p>
    <div class="grid grid-4" id="related-grid"></div>
  </div>`;
  const related=PRODUCTS.filter(p=>p.category===product.category&&p.id!==product.id).slice(0,4);
  document.getElementById("related-grid").innerHTML=related.length?related.map(p=>`
    <a href="product.html?id=${p.id}" class="product-card">
      <div class="product-img">${p.emoji}</div>
      <div class="product-body">
        <span class="product-cat">${p.category}</span>
        <h3>${p.name}</h3>
        <div class="price">${formatPrice(p.price)}</div>
      </div>
    </a>`).join(""):'<p class="muted">No related products found.</p>';
}

function changeQty(d){
  const el=document.getElementById("qty");if(!el)return;
  let v=parseInt(el.value||"1",10)+d;
  const max=product?product.stock:99;
  v=Math.max(1,Math.min(v,max||1));el.value=v;
}
function qtyVal(){
  const el=document.getElementById("qty");if(!el)return;
  let v=parseInt(el.value||"1",10);
  if(isNaN(v)||v<1)v=1;
  if(product&&v>product.stock)v=product.stock;
  el.value=v;
}
function addThisToCart(){
  const qty=parseInt(document.getElementById("qty").value||"1",10);
  Cart.add(product.id,qty);
  toast("Added "+qty+" × "+product.name+" to cart");
}
</script>
</body>
</html>
