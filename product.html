<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — demo_website</title>
<link rel="stylesheet" href="css/styles.css">
<style>
.product-detail-img{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg)}
.product-detail-img img{width:100%;height:380px;object-fit:cover}
@media(max-width:700px){.product-detail{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<section style="padding:40px 0">
  <div class="container">
    <div id="product-content"></div>
  </div>
</section>
<section style="padding-top:0">
  <div class="container">
    <h2 class="section-title mb-20">You may also like</h2>
    <div class="grid grid-4" id="related-grid"></div>
  </div>
</section>
<script>
const PRODUCT_IMAGES={"1": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "2": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "3": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "4": "https://images.unsplash.com/photo-1585421514738-01798e348b17?w=600&q=80&auto=format&fit=crop", "5": "https://images.unsplash.com/photo-1585421514738-01798e348b17?w=600&q=80&auto=format&fit=crop", "6": "https://images.unsplash.com/photo-1585421514738-01798e348b17?w=600&q=80&auto=format&fit=crop", "7": "https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=600&q=80&auto=format&fit=crop", "8": "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=600&q=80&auto=format&fit=crop", "9": "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&q=80&auto=format&fit=crop", "10": "https://images.unsplash.com/photo-1583485088034-697b5bc36b92?w=600&q=80&auto=format&fit=crop", "11": "https://images.unsplash.com/photo-1597318181409-cf64d0b5d8a2?w=600&q=80&auto=format&fit=crop", "12": "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=600&q=80&auto=format&fit=crop", "13": "https://images.unsplash.com/photo-1513885535751-8b9238fd3c42?w=600&q=80&auto=format&fit=crop", "14": "https://images.unsplash.com/photo-1531346878377-a5be20888e57?w=600&q=80&auto=format&fit=crop", "15": "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&q=80&auto=format&fit=crop", "16": "https://images.unsplash.com/photo-1580480045273-3611478254b4?w=600&q=80&auto=format&fit=crop"};
const params=new URLSearchParams(window.location.search);
const productId=parseInt(params.get("id"));
const product=getProduct(productId);
if(!product){
  document.getElementById("product-content").innerHTML='<div class="empty-state"><div style="font-size:3rem">❓</div><p>Product not found.</p><a href="catalog.html" class="btn btn-primary mt-20">Back to Catalog</a></div>';
}else{
  document.title=product.name+" — demo_website";
  const img=PRODUCT_IMAGES[productId];
  document.getElementById("product-content").innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start" class="product-detail">
      <div class="product-detail-img">
        ${img?`<img src="${img}" alt="${product.name}" loading="lazy">`:`<div style="font-size:7rem;height:380px;display:flex;align-items:center;justify-content:center;background:var(--surface)">${product.emoji}</div>`}
      </div>
      <div>
        <span class="badge">${product.category}</span>
        <h1 style="font-size:1.8rem;font-weight:800;margin:12px 0">${product.name}</h1>
        <div style="font-size:2rem;font-weight:800;color:var(--accent);margin-bottom:20px">${formatPrice(product.price)}</div>
        <p style="color:var(--text-mid);margin-bottom:24px">${product.desc}</p>
        <div style="margin-bottom:24px">
          ${product.stock>0?'<span class="status status-confirmed">In Stock ('+product.stock+' available)</span>':'<span class="status status-cancelled">Out of Stock</span>'}
        </div>
        <div style="display:flex;gap:14px;align-items:center;margin:20px 0;flex-wrap:wrap">
          <div class="qty-row" style="margin:0">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <input class="qty-input" type="text" id="qty-display" value="1" readonly>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
          <button class="btn btn-primary" onclick="addToCart()" ${product.stock===0?'disabled':''}>🛒 Add to Cart</button>
          <button class="btn btn-secondary" onclick="buyNow()" ${product.stock===0?'disabled':''}>Buy Now</button>
        </div>
        <div style="margin-top:24px;padding:16px;background:var(--card);border-radius:10px;border:1px solid var(--border)">
          <p style="font-size:.85rem;color:var(--text-dim)">🚚 Nationwide delivery in 2-3 business days</p>
          <p style="font-size:.85rem;color:var(--text-dim)">🧾 Tax-compliant invoicing included</p>
          <p style="font-size:.85rem;color:var(--text-dim)">↩️ 7-day return policy</p>
        </div>
      </div>
    </div>
  `;
  const related=PRODUCTS.filter(p=>p.category===product.category&&p.id!==productId).slice(0,4);
  document.getElementById("related-grid").innerHTML=related.map(p=>`
    <a href="product.html?id=${p.id}" class="product-card">
      <div class="product-img" style="height:180px">${PRODUCT_IMAGES[p.id]?`<img src="${PRODUCT_IMAGES[p.id]}" alt="${p.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover">`:p.emoji}</div>
      <div class="product-body">
        <span class="product-cat">${p.category}</span>
        <h3>${p.name}</h3>
        <div class="price">${formatPrice(p.price)}</div>
      </div>
    </a>
  `).join("");
}
let qty=1;
function changeQty(d){qty=Math.max(1,qty+d);document.getElementById("qty-display").value=qty}
function addToCart(){Cart.add(productId,qty);toast("Added "+qty+" × "+product.name+" to cart")}
function buyNow(){Cart.add(productId,qty);window.location.href="checkout.html"}
</script>
<div id="footer-placeholder"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
